context:
  version: "1.1.1"

package:
  name: libgbm
  version: ${{ version }}

source:
  url: https://github.com/glfs-book/libgbm/archive/refs/tags/${{ version }}.tar.gz
  sha256: 0e7a28d886d0f9442a55613657d92a0a0d66339cbc8ebc6ada3918c56952ec19

build:
  number: 0
  skip:
    - not linux

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - ${{ compiler('cxx') }}
    - meson
    - pkgconf
  host:
    - libdrm
  run_exports:
    - ${{ pin_subpackage('libgbm', upper_bound='x.x') }}

tests:
  - package_contents:
      include:
        - gbm.h
      lib:
        - gbm

about:
  homepage: https://github.com/glfs-book/libgbm
  license: MIT
  license_file: LICENSE
  summary: Generic Buffer Management backend loader

extra:
  recipe-maintainers:
    - jschueller
